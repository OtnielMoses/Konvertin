name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit, Pint, dan build aset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, zip, pdo_sqlite, fileinfo
          coverage: none

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: resources/engines/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Ghostscript dan pustaka sistem untuk OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript libgl1

      - name: Pustaka mesin Python
        run: python -m pip install -r resources/engines/requirements.txt

      - name: Dependensi Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependensi dan build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format kode (Pint)
        run: vendor/bin/pint --test

      - name: Tes
        run: php artisan test --compact
        env:
          KONVERTIN_PYTHON: python

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (tanpa push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: konvertin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
